<!-- @dsCard group="Components" viewport="700x340" name="Forms — Input, Select, Checkbox" subtitle="Booking & enquiry field language" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--c-polar); padding: 22px; }
  .panel { background: var(--c-white); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, Checkbox } = window.WeathersonCoachingDesignSystem_5286a0;
    const Mail = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>);
    function Demo() {
      return (
        <div className="panel">
          <div className="stack">
            <Input label="Full name" placeholder="e.g. Jamie Smith" required />
            <Input label="Email" type="email" icon={<Mail/>} hint="Only used to confirm your session." />
            <Input label="Phone" error="Enter a valid UK number." defaultValue="07" />
          </div>
          <div className="stack">
            <Select label="Programme" options={["1-2-1 coaching","Group session","Team training"]} />
            <Select label="Age group" options={[{value:"6",label:"Ages 6–11"},{value:"12",label:"Ages 12–16"},{value:"a",label:"Adult / semi-pro"}]} />
            <Checkbox label="I'm booking for my child" defaultChecked />
            <Checkbox label="Add video analysis" description="Clipped breakdown after each session (+£10)." />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>

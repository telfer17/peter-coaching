<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Coaching</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg-page); color: var(--text-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  @keyframes wcFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wcPop { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
  .wc-menu-btn { display: none !important; }
  @media (max-width: 920px) {
    .wc-nav { display: none !important; }
    .wc-header-cta { display: none !important; }
    .wc-menu-btn { display: grid !important; place-items: center; }
    .wc-hero-grid, .wc-about-grid, .wc-cta-grid { grid-template-columns: 1fr !important; }
    .wc-prog-grid, .wc-quote-grid, .wc-stats-grid { grid-template-columns: 1fr 1fr !important; }
    .wc-foot-grid { grid-template-columns: 1fr 1fr !important; }
    .wc-cta-details { border-left: none !important; padding-left: 0 !important; }
  }
  @media (max-width: 560px) {
    .wc-prog-grid, .wc-quote-grid, .wc-stats-grid, .wc-foot-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" data-presets="env,react" src="icons.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="SiteHeader.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="Hero.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="StatsStrip.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="Programmes.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="About.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="Testimonials.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="Booking.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="SiteFooter.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="App.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    const mount = () => {
      if (!window.WCApp) { return setTimeout(mount, 30); }
      ReactDOM.createRoot(document.getElementById('root')).render(<window.WCApp/>);
    };
    mount();
  </script>
</body>
</html>

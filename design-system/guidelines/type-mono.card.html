<!-- @dsCard group="Type" viewport="700x170" name="Mono — Geist Mono" subtitle="Stats, fixtures, times & data — the scoreboard voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--c-ink-900); padding: 22px; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .stat { font-family: var(--font-mono); }
  .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--c-gray-400); }
  .v { font-family: var(--font-display); font-size: 44px; line-height: 1; margin-top: 6px; color: #fff; }
  .v .u { font-family: var(--font-mono); font-size: 16px; color: var(--c-blue-electric); margin-left: 2px; }
  .fix { font-family: var(--font-mono); font-size: 13px; color: var(--c-gray-300); margin-top: 4px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="stat"><div class="k">Sessions</div><div class="v">540<span class="u">+</span></div></div>
    <div class="stat"><div class="k">Players</div><div class="v">120</div></div>
    <div class="stat"><div class="k">Pro years</div><div class="v">14</div></div>
    <div class="stat"><div class="k">Ages</div><div class="v">6–34</div></div>
  </div>
  <div class="fix">SAT 09:30 · 1-2-1 · ASTRO PITCH 2 &nbsp;|&nbsp; SUN 10:00 · GROUP · MAIN PITCH</div>
</body>
</html>

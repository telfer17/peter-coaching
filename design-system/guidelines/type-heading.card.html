<!-- @dsCard group="Type" viewport="700x230" name="Headings — Barlow Condensed" subtitle="Athletic condensed for titles, subheads, eyebrows & labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg-surface); padding: 22px; color: var(--text-strong); }
  .eyebrow { font: var(--type-eyebrow); text-transform: uppercase; letter-spacing: .14em; color: var(--c-blue-300); margin-bottom: 12px; }
  h1 { font-family: var(--font-heading); font-weight: 700; font-size: 40px; line-height: 1.05; margin: 0 0 6px; }
  h2 { font-family: var(--font-heading); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0 0 6px; }
  h3 { font-family: var(--font-heading); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 0; color: var(--text-body); }
  .spec { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }
</style>
</head>
<body>
  <div class="eyebrow">Programmes · Eyebrow 14/600</div>
  <h1>Coaching that builds players <span class="spec">H1 · 40/700</span></h1>
  <h2>Every age. Every level. <span class="spec">H2 · 30/700</span></h2>
  <h3>One-to-one, group &amp; team sessions <span class="spec">H3 · 22/600</span></h3>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Tuned for dark — success, warning, danger, each with a soft tint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg-surface); padding: 18px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .pair { display: flex; gap: 8px; align-items: stretch; }
  .sw { border-radius: var(--radius-sm); height: 72px; flex: 2; }
  .tint { border-radius: var(--radius-sm); height: 72px; flex: 1; border: 1px solid rgba(255,255,255,.10); }
  .name { font-family: var(--font-heading); font-weight: 600; font-size: 13px; margin: 8px 1px 0; color: var(--text-strong); letter-spacing:.02em; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="pair"><div class="sw" style="background:var(--c-success)"></div><div class="tint" style="background:var(--c-success-tint)"></div></div><div class="name">Success</div><div class="hex">#34C77B</div></div>
    <div><div class="pair"><div class="sw" style="background:var(--c-warning)"></div><div class="tint" style="background:var(--c-warning-tint)"></div></div><div class="name">Warning</div><div class="hex">#E7B617</div></div>
    <div><div class="pair"><div class="sw" style="background:var(--c-danger)"></div><div class="tint" style="background:var(--c-danger-tint)"></div></div><div class="name">Danger</div><div class="hex">#F0565B</div></div>
  </div>
</body>
</html>

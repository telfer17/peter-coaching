<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg-surface); padding: 22px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 76px; height: 64px; background: var(--c-mist); border: 1.5px solid var(--c-gray-300); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-strong); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
  .pill { width: 96px; border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lbl">xs</div><div class="px">3px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm</div><div class="px">6px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md</div><div class="px">10px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg</div><div class="px">16px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl</div><div class="px">24px</div></div>
    <div class="col"><div class="box pill"></div><div class="lbl">pill</div><div class="px">999</div></div>
  </div>
</body>
</html>

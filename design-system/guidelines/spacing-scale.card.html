<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid — space-1 (4px) → space-9 (64px)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg-surface); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--c-blue-500); border-radius: var(--radius-xs); width: 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-strong); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:var(--space-1)"></div><div class="lbl">1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="height:var(--space-2)"></div><div class="lbl">2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:var(--space-3)"></div><div class="lbl">3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:var(--space-4)"></div><div class="lbl">4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:var(--space-5)"></div><div class="lbl">5</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:var(--space-6)"></div><div class="lbl">6</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:var(--space-7)"></div><div class="lbl">7</div><div class="px">40</div></div>
    <div class="col"><div class="bar" style="height:var(--space-8)"></div><div class="lbl">8</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="height:var(--space-9)"></div><div class="lbl">9</div><div class="px">64</div></div>
  </div>
</body>
</html>

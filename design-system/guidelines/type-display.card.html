<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg-surface); padding: 22px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; margin-bottom: 10px; }
  .big { font-family: var(--font-display); color: var(--text-strong); line-height: .9; letter-spacing: .01em; }
  .hero { font-size: 64px; }
  .num { font-family: var(--font-display); font-size: 92px; line-height: .85; color: var(--c-blue-500); display:inline-block; }
  .lockrow { display:flex; align-items:baseline; gap: 22px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="eyebrow">Anton · 400 · letter-spacing .01em · line-height .9</div>
  <div class="lockrow">
    <div class="big hero">SHARPEN<br>THE EDGE</div>
    <div class="num">01</div>
  </div>
</body>
</html>
